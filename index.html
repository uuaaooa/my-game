<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="게임 프로그래머를 꿈꾸는 전선우의 자기소개 페이지">
  <title>전선우 | 자기소개</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="profile">
    <header class="intro">
      <p class="eyebrow">PLAYER PROFILE</p>
      <h1>전선우<span class="accent">.</span></h1>
      <p class="description">게임 프로그래머를 꿈꾸는</p>
    </header>

    <section class="games" aria-labelledby="games-title">
      <h2 id="games-title">좋아하는 게임</h2>
      <p class="favorite">가장 좋아하는 게임 <strong>블루아카이브</strong></p>
      <ul class="game-list">
        <li><span class="number" aria-hidden="true">01</span><span>엘소드</span></li>
        <li><span class="number" aria-hidden="true">02</span><span>니케:승리의 여신</span></li>
        <li><span class="number" aria-hidden="true">03</span><span>좀비고등학교</span></li>
      </ul>
    </section>
    <footer>게임을 즐기는 오늘, 게임을 만드는 내일.</footer>
  </main>
</body>
</html>
